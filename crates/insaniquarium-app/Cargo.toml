[package]
name = "insaniquarium-app"
description = "Bevy frontend for the Insaniquarium reimplementation"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
sexy-core.workspace = true
insaniquarium-sim.workspace = true
thiserror = "2"
bevy = { workspace = true, features = ["default_app", "default_platform", "2d", "audio", "wav", "png"] }
# PNG in/out for frame comparison (already in the tree via sexy-core).
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
serde_json = "1"

[features]
# Faster incremental dev builds: `cargo run --features dev`
dev = ["bevy/dynamic_linking"]

[lints]
workspace = true
