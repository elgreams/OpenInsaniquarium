[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sexy-core = { path = "crates/sexy-core" }
insaniquarium-sim = { path = "crates/insaniquarium-sim" }
harness = { path = "crates/harness" }
bevy = { version = "0.20", default-features = false }

[workspace.lints.rust]
# deny (not forbid) so the one FFI module (sexy_core::music) can opt in explicitly.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bevy is heavy; optimize dependencies even in dev builds. Full debug info for
# all of Bevy makes a ~1.4 GB binary and minute-long links; keep line tables only.
[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

# The CPU compositor (the app draws every frame through it) is too slow
# unoptimised; build the app crate with optimisations in dev too.
[profile.dev.package.insaniquarium-app]
opt-level = 2
